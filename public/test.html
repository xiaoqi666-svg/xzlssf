<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>分享接口测试</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;background:#f4f6f9;color:#29313a;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif
    }
    main{width:min(100%,680px);margin:30px auto;padding:16px}
    .card{padding:20px;background:#fff;border-radius:16px;box-shadow:0 8px 28px rgba(31,54,90,.08)}
    h1{margin:0 0 8px;font-size:21px}
    p{color:#808890;font-size:13px;line-height:1.6}
    textarea{width:100%;min-height:310px;padding:12px;border:1px solid #dfe4ea;border-radius:10px;font:12px/1.6 monospace}
    button{width:100%;height:44px;margin-top:12px;border:0;border-radius:9px;background:#1677ff;color:#fff;font-size:15px;font-weight:700}
    pre{white-space:pre-wrap;word-break:break-word;padding:12px;background:#f6f8fa;border-radius:10px;font-size:12px}
    a{color:#1677ff}
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>分享接口测试</h1>
    <p>仅用于部署后验证后端是否可以正常创建分享。正式 APK 会自动提交当前请假数据。</p>
    <textarea id="payload">{
  "name": "测试用户",
  "leaveType": "事假",
  "startTime": "2026-09-20 14:00",
  "endTime": "2026-09-21 18:00",
  "duration": "1天4时0分",
  "reason": "分享功能测试",
  "leaveSchool": "否",
  "applyTime": "2026-09-20 13:20",
  "approverName": "测试审批人",
  "approverRole": "辅导员",
  "approvalTime": "2026-09-20 13:35",
  "approvalNote": "同意",
  "expiresIn": 604800
}</textarea>
    <button id="send">创建测试分享</button>
    <pre id="result">等待测试…</pre>
    <div id="link"></div>
  </div>
</main>
<script>
document.getElementById("send").addEventListener("click", async () => {
  const result = document.getElementById("result");
  const link = document.getElementById("link");
  result.textContent = "正在请求…";
  link.innerHTML = "";
  try {
    const data = JSON.parse(document.getElementById("payload").value);
    const r = await fetch("/api/share", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(data)
    });
    const j = await r.json();
    result.textContent = JSON.stringify(j, null, 2);
    if (j.url) {
      const a = document.createElement("a");
      a.href = j.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "打开生成的分享链接";
      link.appendChild(a);
    }
  } catch(e) {
    result.textContent = String(e);
  }
});
</script>
</body>
</html>
